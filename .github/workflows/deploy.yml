name: Deploy Pronto to GitHub Pages

# Builds the Vite PWA and publishes client/dist to GitHub Pages on every push.
# One-time setup in the repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     VITE_SUPABASE_URL       = https://YOUR-ref.supabase.co
#     VITE_SUPABASE_ANON_KEY  = your anon/public key
#     VITE_TMDB_KEY           = your TMDB API key (optional — enables "Movie night")
#     VITE_GIPHY_KEY          = your Giphy API key (optional — enables GIF search)
#     VITE_YOUTUBE_KEY        = your YouTube Data API key (optional — enables Reels)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: client
        run: npm install
      - name: Build
        working-directory: client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
          VITE_GIPHY_KEY: ${{ secrets.VITE_GIPHY_KEY }}
          VITE_YOUTUBE_KEY: ${{ secrets.VITE_YOUTUBE_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
