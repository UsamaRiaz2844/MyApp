# Render Blueprint — deploys the whole Pronto app (backend + frontend) for free.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. In Render: New +  ->  Blueprint  ->  pick this repo.
#   3. When prompted, paste your MongoDB Atlas connection string into MONGODB_URI.
#   4. Deploy. Render creates both services and wires the frontend to the backend.
#
# Notes:
#   - JWT_SECRET is generated automatically.
#   - CLIENT_ORIGIN defaults to "*" (allow any origin) so there is no
#     frontend/backend URL chicken-and-egg. Tighten it later to your frontend
#     URL if you want.
#   - The free web service sleeps after ~15 min idle and cold-starts (~50s) on
#     the next request. That is fine for this socket-only chat app.

services:
  # ---- Backend: Node + Express + Socket.IO API ----
  - type: web
    name: pronto-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false # you paste this at deploy time
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"

  # ---- Frontend: React + Vite PWA (static site) ----
  - type: web
    name: pronto-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Auto-filled with the backend's hostname; the client prepends https://.
      - key: VITE_API_URL
        fromService:
          type: web
          name: pronto-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
